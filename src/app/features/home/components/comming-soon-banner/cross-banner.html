<div
  class="banner-container"
  [style.--speed]="speed + 's'"
>
  <!-- Ribbon 1 -->
  <div
    class="ribbon ribbon-1"
    [style.--angle]="banners[0].angle + 'deg'"
  >
    <div class="marquee">
      <span>{{ banners[0].text }}</span>
    </div>
  </div>

  <!-- Ribbon 2 -->
  <div
    class="ribbon ribbon-2"
    [style.--angle]="banners[1].angle + 'deg'"
  >
    <div class="marquee">
      <span>{{ banners[1].text }}</span>
    </div>
  </div>
</div>
