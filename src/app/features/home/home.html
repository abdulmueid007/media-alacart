<main class="min-h-screen flex flex-col items-center justify-center px-6 text-center">

  <div class="max-w-4xl mx-auto space-y-8 animate-fade-up">

    <!-- Badge -->
    <div class="inline-flex items-center gap-2.5 bg-brand/10 text-brand border border-brand/20 px-4 py-1.5 rounded-full text-sm font-medium">
      <span class="w-2 h-2 rounded-full bg-brand animate-pulse-glow"></span>
      Now Live — Retail Media Platform
    </div>

    <!-- Headline -->
    <h1 class="text-5xl md:text-7xl font-bold text-white leading-[1.08] tracking-tight">
      The Future of<br>
      <span class="bg-gradient-to-r from-brand to-brand-light bg-clip-text text-transparent">
        Retail Media
      </span>
    </h1>

    <!-- Subheadline -->
    <p class="text-lg md:text-xl text-muted max-w-xl mx-auto leading-relaxed">
      One platform to plan, activate, and measure every retail&nbsp;media
      campaign — across every channel, every retailer.
    </p>

    <!-- CTAs -->
    <div class="flex flex-wrap items-center justify-center gap-4 pt-2">
      <a routerLink="/demo"
         class="inline-flex items-center gap-2 bg-gradient-to-r from-brand to-brand-light text-white font-semibold px-8 py-3.5 rounded-full text-base transition-transform duration-200 hover:scale-105 active:scale-[.97]">
        Request a Demo
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
        </svg>
      </a>
      <a routerLink="/platform"
         class="inline-flex items-center gap-2 text-text border border-white/10 hover:border-brand/30 px-8 py-3.5 rounded-full text-base font-medium transition-[border-color,color] duration-200 hover:text-white">
        The Platform
      </a>
    </div>

  </div>

  <!-- Ambient glow -->
  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] rounded-full bg-brand/[.06] blur-[120px]"></div>
  </div>

</main>
