<header class="header" [class.scrolled]="isScrolled">
  <div class="header-inner">

    <!-- Logo -->
    <a class="logo" routerLink="/">
      <img
        src="assets/images/logo.png"
        alt="media alacarte"
        class="logo-img"
      />
    </a>

    <!-- Desktop Navigation -->
    <nav class="nav">
      @for (link of navLinks; track link.path) {
        <a
          class="nav-link"
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <!-- Desktop Login -->
    <a class="login-btn" routerLink="/login">
      Login
    </a>

    <!-- Hamburger (Mobile) -->
    <button
      class="hamburger"
      [class.open]="isMenuOpen"
      (click)="toggleMenu()"
      aria-label="Toggle menu"
      aria-expanded="{{ isMenuOpen }}"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>

  <!-- Mobile Navigation -->
  <nav class="mobile-nav" [class.open]="isMenuOpen">

    @for (link of navLinks; track link.path) {
      <a
        class="mobile-link"
        [routerLink]="link.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: link.path === '/' }"
        (click)="closeMenu()"
      >
        {{ link.label }}
      </a>
    }

    <a
      class="login-btn mobile-login"
      routerLink="/login"
      (click)="closeMenu()"
    >
      Login
    </a>

  </nav>
</header>
