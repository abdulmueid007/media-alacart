<div class="card">
  <img [src]="image" alt="service" />

  <!-- Hover Content -->
  <div class="overlay">
    <div>
        <h2>{{ title }}</h2>
        <p>{{ description }}</p>
    </div>
    <div class="cta">
       <app-icon 
          [icon]="faArrowRight"
          color="#fff"
          size="lg"
        />
    </div>
  </div>

  <!-- Default Vertical Button -->
  <div class="vertical-label">
    {{ title }}
  </div>
</div>
