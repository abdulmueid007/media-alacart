<div class="card">
  <app-image
    [src]="image"
    [alt]="title"
    borderRadius="24px"
  />

  <div class="overlay">
    <div>
        <h2>{{ title }}</h2>
        <p>{{ description }}</p>
    </div>
    <app-icon-button iconButton/>
  </div>

  <div class="vertical-label">
    {{ title }}
  </div>
</div>
