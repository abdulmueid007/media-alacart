<div class="card" [class.highlight]="data.highlight" appSlideReveal 
  [animation]="index % 3 === 0 ? 'slide-left' : 'slide-right'">
  <div class="icon" *ngIf="data.icon">
    <img [src]="data.icon" alt="" />
  </div>

  <h3>{{ data.title }}</h3>
  <p>{{ data.description }}</p>

  <div class="button-wrapper">
    <app-icon-button iconButton variant="outlined"/>
  </div>
  
</div>
