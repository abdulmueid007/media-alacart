<div class="media-wrapper">
  <div class="media-card">
    <h1 appSlideReveal [animation]="'slide-down'">{{ mediaInfo.title }} <br /></h1>

    <div class="features">
      @for (bullet of mediaInfo.bullets; track bullet; let i = $index) {
        <div
          class="feature"
          appSlideReveal
          [animation]="i % 2 === 0 ? 'slide-right' : 'slide-left'"
        >
          <app-icon [icon]="faCheckCircle" size="xl" color="var(--color-brand)" />
          <p>{{ bullet }}</p>
        </div>
      }
    </div>

    <button
      appButton
      variant="primary"
      textColor="var(--color-surface)"
      class="media-button"
      appSlideReveal
      [animation]="'zoom'"
    >
      Optimize Your Media Today
      <app-icon [icon]="faAngleRight" />
    </button>
  </div>
</div>
