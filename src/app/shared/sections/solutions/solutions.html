<ng-container *ngIf="solutionData">
  <section class="section">

    <!-- Heading -->
    <div class="heading">
      <p class="tag">WHY MEDIA ALA CARTE?</p>

      <h1>
        {{ solutionData.heading }}
        <span class="highlight" [appSlideReveal]="'down'" [once]="true" [delay]=".5">{{ solutionData.highlightText }}</span>
        {{ solutionData.subheading }}
      </h1>
    </div>

    <!-- Grid -->
    <div class="grid">

      <!-- Hero Banner -->
      <div class="hero" 
        [appSlideReveal]="'up'">
        <app-image
          [src]="solutionData.heroImage"
          alt="heroImage"
          borderRadius="16px"
        />
        <div class="overlay">
          <p>{{ solutionData.heroText }}</p>
          <button appButton variant="primary" textColor="var(--color-surface)">
            Get Started
          </button>
        </div>
      </div>

    @for (card of solutionData.cards; track card.title; let i = $index) {
      <app-solution-card
      
        [data]="card"
        
       [appSlideReveal]="i % 3 === 0 ? 'left' : 'right'" />
      
    }
    </div>

  </section>
</ng-container>
