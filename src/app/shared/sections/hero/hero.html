<section class="hero">

  <!-- Corner blobs -->
  <div class="hero-bg" aria-hidden="true"></div>

  <div class="hero-container">

     <div class="hero-text">
    <p class="badge">#1 MEDIA MARKETPLACE FOR ADVERTISERS &amp; AGENCIES</p>
    <p class="bigger-impact">Bigger Impact</p>
    <h1 class="main-title">Stronger Campaigns</h1>
    <p class="tagline">Smarter Media Buying</p>
  </div>

    <!-- Visual area -->
    <div class="hero-visual">

      <!-- CTA overlaps the top-left of the card -->
      

      <!-- Image card (overflow:hidden clips the corners) -->
      <div class="hero-card">
        <img
          src="assets/images/hero-banner.png"
          alt="Business professionals collaborating"
          class="hero-img"
        />
          <app-button variant="primary" size="lg" link="/demo" class="hero-cta">
            Start your journey!
          </app-button>

        <!-- Learn More overlaps the bottom-right corner -->
        <app-button variant="dark-glass" size="md" link="/platform" class="hero-learn">
          <app-icon 
            [icon]="faPlayCircle"
            color="#fff"
          />
          Learn More
        </app-button>
      </div>

    </div>
  </div>

</section>
