<header class="header" [class.scrolled]="isScrolled">
  <div class="header-inner">

    <!-- Logo -->
    <a class="logo" routerLink="/">
      <img
        src="assets/images/logo.png"
        alt="media alacarte"
        class="logo-img"
      />
    </a>

    <!-- Desktop Navigation -->
    <nav class="nav">
      @for (link of navLinks; track link.path; let i = $index) {
        <a
          class="nav-link"
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          appSlideReveal
          [delay]="i * 200"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <button appButton class="login-btn">Login</button>

    <button
      class="hamburger"
      [class.open]="isMenuOpen()"
      (click)="toggleMenu()"
      aria-label="Toggle menu"
      [attr.aria-expanded]="isMenuOpen()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>

  <!-- Mobile Navigation -->
  <nav class="mobile-nav" [class.open]="isMenuOpen()" 
  >

    @for (link of navLinks; track link.path; let i = $index) {
      <a
        class="mobile-link"
        [routerLink]="link.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: link.path === '/' }"
        (click)="closeMenu()"
        ngmMotion
          [animate]="isMenuOpen() ? 'visible' : 'hidden'"
          [variants]="itemVariants"
          [transition]="{
            type: 'spring',
            stiffness: 300,
            damping: 24,
            delay: i * 0.08
          }"
      >
        {{ link.label }}
      </a>
    }

    <button appButton class="ogin-btn mobile-login" (click)="closeMenu()">Login</button>

  </nav>
</header>
