<header class="header" [class.scrolled]="isScrolled">
  <div class="header-inner">
    <!-- Logo -->
    <a class="logo" routerLink="/">
      <img src="assets/images/logo.png" alt="media alacarte" class="logo-img" />
    </a>

    <!-- Desktop Navigation -->
    <nav class="nav">
      @for (link of navLinks; track link.path; let i = $index) {
        <a
          class="nav-link"
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          appSlideReveal
          [delay]="i * 200"
        >
          {{ link.labelKey | translate }}
        </a>
      }
    </nav>

    <div class="header-actions">
      <button
        class="lang-toggle"
        (click)="lang.toggle()"
        [attr.aria-label]="lang.isRtl() ? 'English' : 'العربية'"
      >
        {{ lang.isRtl() ? 'EN' : 'ع' }}
      </button>
      <button appButton class="login-btn">{{ 'header.login' | translate }}</button>
    </div>

    <button
      class="hamburger"
      [class.open]="isMenuOpen()"
      (click)="toggleMenu()"
      [attr.aria-label]="'header.toggleMenu' | translate"
      [attr.aria-expanded]="isMenuOpen()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- Mobile Navigation -->
  <nav class="mobile-nav" [class.open]="isMenuOpen()">
    @for (link of navLinks; track link.path; let i = $index) {
      <a
        class="mobile-link"
        [routerLink]="link.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: link.path === '/' }"
        (click)="closeMenu()"
        ngmMotion
        [animate]="isMenuOpen() ? 'visible' : 'hidden'"
        [variants]="itemVariants"
        [transition]="{
          type: 'spring',
          stiffness: 300,
          damping: 24,
          delay: i * 0.08,
        }"
      >
        {{ link.labelKey | translate }}
      </a>
    }
    <button
      ngmMotion
      [animate]="isMenuOpen() ? 'visible' : 'hidden'"
      [variants]="itemVariants"
      (click)="lang.toggle(); closeMenu()"
      class="mobile-lang"
      type="button"
      aria-label="Change language"
    >
      <span class="lang">EN</span>
      <span class="divider" aria-hidden="true">|</span>
      <span class="lang ar">ع</span>
    </button>
    <button appButton class="ogin-btn mobile-login" (click)="closeMenu()">
      {{ 'header.login' | translate }}
    </button>
  </nav>
</header>
